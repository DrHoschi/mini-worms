<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#13213b" />
  <title>Mini-Worms – Web Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="brand"><span class="logo-mark">🐌</span> Mini-Worms <span class="tag">WEB TEST</span></div>
      <div class="status" id="status">Lade…</div>
    </header>
    <section class="game-wrap">
      <canvas id="game" aria-label="Mini-Worms Web-Prototyp"></canvas>
      <div class="vignette"></div>
      <div id="message" class="message hidden"></div>
    </section>
    <section class="readout">
      <div><b id="activeName">Sheldon</b><small>AKTIV</small></div>
      <div><b id="hpText">100 HP</b><small>LEBEN</small></div>
      <div><b id="angleText">45°</b><small>WINKEL</small></div>
      <div><b id="powerText">62%</b><small>STÄRKE</small></div>
    </section>
    <section class="controls" aria-label="Touch-Steuerung">
      <div class="control-group move">
        <button data-hold="left" aria-label="Nach links"><span>◀</span><small>LAUF</small></button>
        <button data-tap="jump" aria-label="Springen"><span>▲</span><small>SPRUNG</small></button>
        <button data-hold="right" aria-label="Nach rechts"><span>▶</span><small>LAUF</small></button>
      </div>
      <div class="control-group aim">
        <button data-hold="aimDown" aria-label="Zielwinkel senken"><span>↙</span><small>ZIEL</small></button>
        <button data-hold="aimUp" aria-label="Zielwinkel erhöhen"><span>↗</span><small>ZIEL</small></button>
      </div>
      <div class="control-group power">
        <button data-hold="powerDown" aria-label="Stärke verringern"><span>−</span><small>POWER</small></button>
        <button data-hold="powerUp" aria-label="Stärke erhöhen"><span>＋</span><small>POWER</small></button>
      </div>
      <button id="fire" class="fire" aria-label="Feuern"><span>💥</span><small>FEUER</small></button>
    </section>
    <footer>Experimenteller Browser-Prototyp · Gameplaytest vor der späteren Unity-Implementierung</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
